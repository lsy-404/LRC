<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>受邀请贡献者投稿 · LRC</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #24292f; --muted: #6e7781;
    --line: #d8dee4; --accent: #3a7afe; --accent-text: #ffffff;
    --ok: #1a7f37; --err: #cf222e; --bar-bg: #eaeef2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --card: #1f2329; --text: #e6e8eb; --muted: #8b949e;
      --line: #363b42; --accent: #4c8dff; --ok: #3fb950; --err: #f85149; --bar-bg: #2b3036;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 13px; }
  .sub a { color: var(--accent); text-decoration: none; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  input[type="password"], input[type="text"] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 8px 16px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
    background: var(--card); color: var(--text); font-size: 14px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .msg-ok { color: var(--ok); font-size: 13px; }
  .msg-err { color: var(--err); font-size: 13px; }
  #filelist { list-style: none; margin: 12px 0 0; padding: 0; font-size: 13px; max-height: 300px; overflow-y: auto; }
  #filelist li {
    display: flex; gap: 8px; align-items: center; padding: 5px 2px;
    border-bottom: 1px solid var(--line);
  }
  #filelist li:last-child { border-bottom: none; }
  .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fsize { color: var(--muted); flex-shrink: 0; }
  .fstat { flex-shrink: 0; width: 3.5em; text-align: right; }
  .fstat.done { color: var(--ok); }
  .fstat.fail { color: var(--err); }
  .bar { height: 8px; background: var(--bar-bg); border-radius: 4px; overflow: hidden; margin-top: 14px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>受邀请贡献者投稿</h1>
  <p class="sub">凭邀请密码将整张专辑的原料直接上传到投递箱，无需 Git。
    处理流程见 <a href="/CONTRIBUTING.html">贡献指南</a>。</p>

  <!-- 第一步：密码验证 -->
  <section class="card" id="gate">
    <h2>1 · 验证邀请密码</h2>
    <label for="pw">密码</label>
    <input type="password" id="pw" autocomplete="off">
    <div class="row">
      <button class="primary" id="btn-verify">验证</button>
      <span id="gate-msg"></span>
    </div>
  </section>

  <!-- 第二步：填写与选择 -->
  <section class="card hidden" id="form">
    <h2>2 · 专辑与文件</h2>
    <label for="album">专辑名称（作为投递文件夹名，也是最终专辑名）</label>
    <input type="text" id="album" placeholder="例：再次呼唤我的名字吧">
    <div class="row">
      <button id="btn-files">添加文件</button>
      <button id="btn-dir">添加文件夹</button>
      <button id="btn-clear">清空</button>
      <input type="file" id="in-files" multiple class="hidden">
      <input type="file" id="in-dir" webkitdirectory class="hidden">
    </div>
    <ul id="filelist"></ul>
    <p class="hint" id="total"></p>
    <p class="hint">支持歌词文本 / 歌词本图片或 PDF / 音频 / Staff 表 / 封面；
      单文件上限 95MB。上传期间请勿关闭本页。</p>
  </section>

  <!-- 第三步：提交 -->
  <section class="card hidden" id="submit-card">
    <h2>3 · 提交</h2>
    <div class="bar"><div id="bar"></div></div>
    <div class="row">
      <button class="primary" id="btn-submit">提交</button>
      <button id="btn-retry" class="hidden">重试失败文件</button>
      <span id="submit-msg"></span>
    </div>
  </section>

  <!-- 完成 -->
  <section class="card hidden" id="done-card">
    <h2>✓ 投稿完成</h2>
    <p id="done-detail"></p>
    <p class="hint">自动化会在几分钟内处理原料并开出 PR，审核通过后自动入库；
      原料仅在处理期间短暂存在，随后即销毁。</p>
  </section>
</main>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const MAX_FILE = 95 * 1024 * 1024;
  let password = '';
  // items: { file, relPath, size, status: wait|up|done|fail, sha }
  let items = [];
  let busy = false;

  const fmtSize = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB'
    : n >= 1024 ? (n / 1024).toFixed(0) + ' KB' : n + ' B';

  // ---- 密码门 ----
  $('btn-verify').addEventListener('click', async () => {
    const pw = $('pw').value;
    const msg = $('gate-msg');
    msg.className = ''; msg.textContent = '验证中…';
    try {
      const r = await fetch('/api/upload/verify', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      });
      if (!r.ok) { msg.className = 'msg-err'; msg.textContent = '密码错误'; return; }
      password = pw;
      msg.className = 'msg-ok'; msg.textContent = '验证通过';
      $('pw').disabled = true; $('btn-verify').disabled = true;
      $('form').classList.remove('hidden');
      $('submit-card').classList.remove('hidden');
    } catch {
      msg.className = 'msg-err'; msg.textContent = '网络错误，请重试';
    }
  });

  // ---- 文件选择 ----
  $('btn-files').addEventListener('click', () => $('in-files').click());
  $('btn-dir').addEventListener('click', () => $('in-dir').click());
  $('btn-clear').addEventListener('click', () => { if (!busy) { items = []; render(); } });

  $('in-files').addEventListener('change', (e) => {
    addFiles([...e.target.files].map((f) => ({ file: f, relPath: f.name })));
    e.target.value = '';
  });
  $('in-dir').addEventListener('change', (e) => {
    const list = [...e.target.files];
    if (list.length && !$('album').value) {
      // 文件夹名预填专辑名
      $('album').value = list[0].webkitRelativePath.split('/')[0];
    }
    addFiles(list.map((f) => ({
      file: f,
      relPath: f.webkitRelativePath.split('/').slice(1).join('/') || f.name,
    })));
    e.target.value = '';
  });

  function addFiles(picked) {
    if (busy) return;
    const have = new Set(items.map((i) => i.relPath));
    for (const p of picked) {
      if (have.has(p.relPath)) continue;
      have.add(p.relPath);
      items.push({ ...p, size: p.file.size, status: 'wait', sha: null });
    }
    render();
  }

  function render() {
    const ul = $('filelist');
    ul.textContent = '';
    let total = 0, oversize = 0;
    for (const it of items) {
      total += it.size;
      const li = document.createElement('li');
      const name = document.createElement('span');
      name.className = 'fname'; name.textContent = it.relPath;
      const size = document.createElement('span');
      size.className = 'fsize'; size.textContent = fmtSize(it.size);
      const stat = document.createElement('span');
      stat.className = 'fstat';
      if (it.size > MAX_FILE) { stat.className += ' fail'; stat.textContent = '过大'; oversize++; }
      else if (it.status === 'done') { stat.className += ' done'; stat.textContent = '✓'; }
      else if (it.status === 'fail') { stat.className += ' fail'; stat.textContent = '失败'; }
      else if (it.status === 'up') { stat.textContent = it.pct + '%'; }
      else stat.textContent = '待传';
      li.append(name, size, stat);
      ul.append(li);
    }
    $('total').textContent = items.length
      ? `共 ${items.length} 个文件，${fmtSize(total)}` + (oversize ? `；${oversize} 个超出单文件上限，无法提交` : '')
      : '尚未选择文件';
    $('btn-submit').disabled = busy || !items.length || oversize > 0;
  }

  // ---- 上传 ----
  const readBase64 = (file) => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result.slice(fr.result.indexOf(',') + 1));
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(file);
  });

  const uploadBlob = (it, onProgress) => new Promise((resolve) => {
    readBase64(it.file).then((b64) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload/blob');
      xhr.setRequestHeader('content-type', 'application/json');
      xhr.setRequestHeader('authorization', 'Bearer ' + encodeURIComponent(password));
      xhr.upload.onprogress = (e) => e.lengthComputable && onProgress(e.loaded / e.total);
      xhr.onload = () => {
        try {
          const sha = JSON.parse(xhr.responseText).sha;
          resolve(xhr.status === 200 && sha ? sha : null);
        } catch { resolve(null); }
      };
      xhr.onerror = () => resolve(null);
      xhr.send('{"encoding":"base64","content":"' + b64 + '"}');
    }).catch(() => resolve(null));
  });

  async function run() {
    const album = $('album').value.trim();
    const msg = $('submit-msg');
    if (!album) { msg.className = 'msg-err'; msg.textContent = '请填写专辑名称'; return; }
    if (album.includes('/') || album.includes('\\')) {
      msg.className = 'msg-err'; msg.textContent = '专辑名称不能包含斜杠'; return;
    }
    busy = true;
    $('btn-submit').disabled = true; $('btn-retry').classList.add('hidden');
    $('album').disabled = true;
    msg.className = ''; msg.textContent = '上传中…';

    const totalBytes = items.reduce((s, i) => s + i.size, 0);
    let doneBytes = items.filter((i) => i.status === 'done').reduce((s, i) => s + i.size, 0);

    for (const it of items) {
      if (it.status === 'done') continue;
      it.status = 'up'; it.pct = 0; render();
      const sha = await uploadBlob(it, (r) => {
        it.pct = Math.round(r * 100);
        $('bar').style.width = ((doneBytes + it.size * r) / totalBytes * 100) + '%';
        render();
      });
      if (sha) { it.status = 'done'; it.sha = sha; doneBytes += it.size; }
      else it.status = 'fail';
      render();
    }
    $('bar').style.width = (doneBytes / totalBytes * 100) + '%';

    const failed = items.filter((i) => i.status !== 'done').length;
    if (failed) {
      busy = false;
      msg.className = 'msg-err';
      msg.textContent = `${failed} 个文件上传失败`;
      $('btn-retry').classList.remove('hidden');
      $('btn-submit').disabled = false; $('album').disabled = false;
      return;
    }

    msg.textContent = '正在提交到投递箱…';
    try {
      const r = await fetch('/api/upload/finalize', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'authorization': 'Bearer ' + encodeURIComponent(password),
        },
        body: JSON.stringify({
          album,
          files: items.map((i) => ({ path: i.relPath, sha: i.sha })),
        }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.ok) throw new Error(data.message || data.error || r.status);
      $('form').classList.add('hidden');
      $('submit-card').classList.add('hidden');
      $('done-card').classList.remove('hidden');
      $('done-detail').textContent =
        `「${album}」共 ${items.length} 个文件已作为单次提交推入 upload 投递箱（${String(data.commit).slice(0, 7)}）。`;
    } catch (err) {
      busy = false;
      msg.className = 'msg-err';
      msg.textContent = '提交失败：' + err.message + '（已传文件保留，可直接重试）';
      $('btn-submit').disabled = false; $('album').disabled = false;
      $('btn-retry').classList.remove('hidden');
    }
  }

  $('btn-submit').addEventListener('click', run);
  $('btn-retry').addEventListener('click', run);

  window.addEventListener('beforeunload', (e) => { if (busy) e.preventDefault(); });
  render();
})();
</script>
</body>
</html>
