[project]
repo = "wuyilingwei/LRC"
res_dir = "res"
docs_dir = "docs"
albums_dir = "docs/albums"
pack_dir = "pack"
readme_path = "README.md"

[common]
cover_ext = [".jpg", ".png", ".jpeg", ".webp", ".bmp"]

[pull]
whitelist_url = ["bilibili.com", "b23.tv", "taobao.com", "tb.cn", "m.tb.cn", "e.tb.cn", "dizzylab.com"]
lrc_max_kb = 20
meta_max_kb = 5
cover_max_mb = 5
max_files_per_folder = 20
cover_name = "cover"
meta_name = "meta.toml"

[meta]
decode_order = ["utf-8-sig", "utf-8", "gb18030", "gbk"]
lrc_fillable = ["vocal", "lyricist", "composer", "arranger", "tuning", "illustrator", "mixer", "lyric_maker"]

[meta.defaults]
year = ""
produce = ""
vocal = []
lyricist = []
composer = []
arranger = []
tuning = []
illustrator = []
mixer = []
lyric_maker = ""
release = ""
purchase = ""
electronic = ""

[meta.mapping]
年份 = "year"
发行日期 = "year"
year = "year"
release_date = "year"
出品 = "produce"
produce = "produce"
演唱 = "vocal"
vocal = "vocal"
作词 = "lyricist"
lyricist = "lyricist"
作曲 = "composer"
composer = "composer"
编曲 = "arranger"
arranger = "arranger"
调校 = "tuning"
tuning = "tuning"
曲绘 = "illustrator"
illustrator = "illustrator"
混音 = "mixer"
mixer = "mixer"
发布 = "release"
release = "release"
购买 = "purchase"
purchase = "purchase"
电子 = "electronic"
electronic = "electronic"
歌词制作 = "lyric_maker"
lyric_maker = "lyric_maker"

[[meta.field_schema]]
internal = "year"
toml_key = "发行日期"
type = "str"

[[meta.field_schema]]
internal = "produce"
toml_key = "出品"
type = "str"

[[meta.field_schema]]
internal = "lyric_maker"
toml_key = "歌词制作"
type = "str"

[[meta.field_schema]]
internal = "release"
toml_key = "发布"
type = "str"

[[meta.field_schema]]
internal = "purchase"
toml_key = "购买"
type = "str"

[[meta.field_schema]]
internal = "electronic"
toml_key = "电子"
type = "str"

[[meta.field_schema]]
internal = "vocal"
toml_key = "演唱"
type = "list"

[[meta.field_schema]]
internal = "lyricist"
toml_key = "作词"
type = "list"

[[meta.field_schema]]
internal = "composer"
toml_key = "作曲"
type = "list"

[[meta.field_schema]]
internal = "arranger"
toml_key = "编曲"
type = "list"

[[meta.field_schema]]
internal = "tuning"
toml_key = "调校"
type = "list"

[[meta.field_schema]]
internal = "illustrator"
toml_key = "曲绘"
type = "list"

[[meta.field_schema]]
internal = "mixer"
toml_key = "混音"
type = "list"

[lrc]
list_fields = ["vocal", "composer", "arranger", "lyricist", "tuning", "illustrator", "mixer"]

[lrc.id_tag]
ti = "title"
ar = "artist"
al = "album"
by = "lyric_maker"
"lrc by" = "lyric_maker"

[lrc.row_field_alias]
演唱 = "vocal"
主唱 = "vocal"
歌手 = "vocal"
作曲 = "composer"
曲 = "composer"
编曲 = "arranger"
作词 = "lyricist"
词 = "lyricist"
调校 = "tuning"
调 = "tuning"
曲绘 = "illustrator"
绘 = "illustrator"
封面 = "illustrator"
美术 = "illustrator"
混音 = "mixer"
专辑 = "album_tag"

[optimize]
exclude_dirs = [".git", ".github", "scripts", "node_modules", ".vscode"]
extensions = [".lrc"]
