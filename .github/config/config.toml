[project]
repo = "lsy-404/LRC"
res_dir = "res"
docs_dir = "docs"
albums_dir = "docs/albums"
pack_dir = "pack"
readme_path = "README.md"

[common]
cover_ext = [".jpg", ".png", ".jpeg", ".webp", ".bmp"]

[pull]
whitelist_url = ["bilibili.com", "b23.tv", "taobao.com", "tb.cn", "m.tb.cn", "e.tb.cn", "dizzylab.com", "dizzylab.net"]
lrc_max_kb = 20
klrc_max_kb = 80
meta_max_kb = 5
cover_max_mb = 20
max_files_per_folder = 60
cover_name = "cover"
meta_name = "meta.toml"

[meta]
decode_order = ["utf-8-sig", "utf-8", "gb18030", "gbk"]
lrc_fillable = ["vocal", "lyricist", "composer", "arranger", "tuning", "illustrator", "mixer", "lyric_maker"]

[meta.defaults]
year = ""
produce = ""
prefix = ""
zh_name = ""
en_name = ""
suffix = ""
vocal = []
lyricist = []
composer = []
arranger = []
tuning = []
illustrator = []
mixer = []
lyric_maker = ""
release = ""
purchase = ""
electronic = ""

[meta.mapping]
"年份" = "year"
"发行日期" = "year"
