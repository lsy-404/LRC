"前缀" = "prefix"
prefix = "prefix"
"中文名" = "zh_name"
zh_name = "zh_name"
"英文名" = "en_name"
en_name = "en_name"
"后缀" = "suffix"
suffix = "suffix"
"演唱" = "vocal"
vocal = "vocal"
"作词" = "lyricist"
lyricist = "lyricist"
"作曲" = "composer"
composer = "composer"
"编曲" = "arranger"
arranger = "arranger"
"调校" = "tuning"
tuning = "tuning"
"曲绘" = "illustrator"
illustrator = "illustrator"
"混音" = "mixer"
mixer = "mixer"
"母带" = "mastering"
mastering = "mastering"
"视频" = "video"
video = "video"
"策划" = "planning"
planning = "planning"
"发布" = "release"
release = "release"
"购买" = "purchase"
purchase = "purchase"
"电子" = "electronic"
electronic = "electronic"
