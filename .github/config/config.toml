[lrc]
list_fields = ["vocal", "composer", "arranger", "lyricist", "tuning", "illustrator", "mixer"]

[lrc.id_tag]
ti = "title"
ar = "artist"
al = "album"
by = "lyric_maker"
"lrc by" = "lyric_maker"

[lrc.row_field_alias]
"演唱" = "vocal"
"主唱" = "vocal"
"歌手" = "vocal"
"作曲" = "composer"
"曲" = "composer"
"编曲" = "arranger"
"作词" = "lyricist"
"词" = "lyricist"
"调校" = "tuning"
"调" = "tuning"
"曲绘" = "illustrator"
"绘" = "illustrator"
"封面" = "illustrator"
"美术" = "illustrator"
"混音" = "mixer"
"专辑" = "album_tag"

[optimize]
exclude_dirs = [".git", ".github", "scripts", "node_modules", ".vscode"]
extensions = [".lrc"]

# LLM配置（用于智能解析专辑名称）
[llm]
# 是否启用LLM解析（如果为false，回退到正则算法）
enabled = true

# API端点（兼容OpenAI格式）
api_base = "https://api.openai.com/v1"  # 默认值，实际使用时从环境变量读取

# 模型名称
model = "gpt-5-mini"

# API密钥（实际使用时从环境变量 LLM_API_KEY 读取）
# api_key = ""  # 不要在配置文件中存储密钥

# 请求超时（秒）
timeout = 30

# 重试次数
max_retries = 2

# 备用配置（如果主配置失败）
[llm.fallback]
enabled = false
api_base = ""
model = "gpt-5"

[dev.report]
# 元数据完整性报告配置
output_path = "dev/meta.md"
skip_albums = []

# 专辑数据表字段（用于统计缺失项）
data_table_fields = ["vocal", "lyricist", "composer", "arranger", "tuning", "illustrator", "mixer"]

# 核心字段（缺失任一项视为错误）
[dev.report.core_fields]
year = "缺少发行日期"
produce = "缺少出品信息"
release = "缺少发布链接"
purchase_or_electronic = "购买/电子至少需要一个"

# 警告级别字段（缺失视为警告）
[dev.report.warning_fields]
lyric_maker = "缺少歌词制作者"

# 级别判断阈值
[dev.report.thresholds]
# 错误级别：数据表缺失项 >= 此值时在错误中显示统计
error_data_threshold = 3
# 警告级别：数据表缺失项 >= 此值时视为警告
warning_data_threshold = 5
# 提示级别：数据表缺失项 >= 此值时视为提示
hint_data_threshold = 3
