internal = "prefix"
toml_key = "前缀"
type = "str"

[[meta.field_schema]]
internal = "zh_name"
toml_key = "中文名"
type = "str"

[[meta.field_schema]]
internal = "en_name"
toml_key = "英文名"
type = "str"

[[meta.field_schema]]
internal = "suffix"
toml_key = "后缀"
type = "str"

[[meta.field_schema]]
internal = "lyric_maker"
toml_key = "歌词制作"
type = "list"

[[meta.field_schema]]
internal = "release"
toml_key = "发布"
type = "str"

[[meta.field_schema]]
internal = "purchase"
toml_key = "购买"
type = "str"

[[meta.field_schema]]
internal = "electronic"
