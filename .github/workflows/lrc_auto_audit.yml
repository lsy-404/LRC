name: LRC Repository Auto Audit

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'res/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Security and Content Audit
        id: python-audit
        run: python3 .github/scripts/lrc_auto_audit.py
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          DELETED_FILES: ${{ steps.changed-files.outputs.deleted_files }}

      - name: Notify Failure
        if: failure()
        run: |
          ERRORS=$(cat audit_errors.txt)
          gh pr comment "$PR_URL" --body "### ⚠️ 自动化审计未通过
          感谢您的贡献！但本次提交存在以下问题，请修改后重新推送：
          
          $ERRORS
          
          ---
          *修改代码后直接 Push，系统会自动重新检查。*"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Auto Approve and Merge
        if: success()
        run: |
          gh pr approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}