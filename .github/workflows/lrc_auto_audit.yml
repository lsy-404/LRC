name: LRC Repository Auto Audit

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'res/**'
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == 'Retry check' &&
        github.event.comment.user.login == github.repository_owner
      )
    runs-on: ubuntu-latest
    
    steps:
      - name: Resolve PR context
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
            echo "head_ref=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
            echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}" >> $GITHUB_OUTPUT
          else
            pr_number=${{ github.event.issue.number }}
            echo "number=$pr_number" >> $GITHUB_OUTPUT
            pr_json=$(gh api "repos/${{ github.repository }}/pulls/$pr_number")
            echo "head_sha=$(echo "$pr_json" | jq -r '.head.sha')" >> $GITHUB_OUTPUT
            echo "base_sha=$(echo "$pr_json" | jq -r '.base.sha')" >> $GITHUB_OUTPUT
            echo "head_ref=$(echo "$pr_json" | jq -r '.head.ref')" >> $GITHUB_OUTPUT
            echo "head_repo=$(echo "$pr_json" | jq -r '.head.repo.full_name')" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.PULL_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: false
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          token: ${{ secrets.PULL_TOKEN }}

      - name: Checkout base workflow scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .ci-base
          token: ${{ secrets.PULL_TOKEN }}

      - name: Fetch PR base commit
        run: |
          if ! git remote get-url base >/dev/null 2>&1; then
            git remote add base "https://x-access-token:${{ secrets.PULL_TOKEN }}@github.com/${{ github.repository }}.git"
          fi
          git fetch --no-tags base "$BASE_SHA"
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          json: true
          base_sha: ${{ steps.pr.outputs.base_sha }}
          sha: ${{ steps.pr.outputs.head_sha }}

      - name: Persist changed files payload as TOML
        env:
          RAW_CHANGED: ${{ steps.changed-files.outputs.all_changed_files }}
          RAW_DELETED: ${{ steps.changed-files.outputs.deleted_files }}
          CHANGED_FILES_TOML_OUT: .changed_files.toml
          DELETED_FILES_TOML_OUT: .deleted_files.toml
        run: |
          python3 .ci-base/.github/scripts/changed_files_to_toml.py

      - name: Security and Content Audit
        id: python-audit
        run: python3 .ci-base/.github/scripts/lrc_auto_audit.py
        env:
          CHANGED_FILES_TOML: .changed_files.toml
          DELETED_FILES_TOML: .deleted_files.toml
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          DELETED_FILES: ${{ steps.changed-files.outputs.deleted_files }}
        continue-on-error: true

      - name: Notify Failure
        if: steps.python-audit.outcome == 'failure'
        run: |
          ERRORS=$(cat audit_errors.txt)
          gh pr comment "$PR_NUMBER" --body "### ⚠️ 自动化审计未通过
          感谢您的贡献！但本次提交存在以下问题，请修改后重新推送：
          
          $ERRORS
          
          ---
          *修改代码后直接 Push，系统会自动重新检查。*"
        env:
          GH_TOKEN: ${{ secrets.PULL_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_REPO: ${{ github.repository }}

      - name: Ensure PR head unchanged before merge
        if: steps.python-audit.outcome == 'success'
        run: |
          latest_sha=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$latest_sha" != "$EXPECTED_SHA" ]; then
            echo "PR head changed during audit: expected $EXPECTED_SHA, got $latest_sha"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.PULL_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
          GH_REPO: ${{ github.repository }}

      - name: Auto Approve and Merge
        if: steps.python-audit.outcome == 'success'
        run: |
          gh pr approve "$PR_NUMBER"
          gh pr merge --auto --squash "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.PULL_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_REPO: ${{ github.repository }}