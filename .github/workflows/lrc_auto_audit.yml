name: LRC Repository Auto Audit

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'res/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Security and Content Audit
        id: python-audit
        shell: python
        run: |
            import os
            import sys
            import re

            def is_meaningful_text(content):
                # CJK, Basic Latin, and common LRC symbols
                allowed_pattern = re.compile(r'[\u4e00-\u9fff\u0020-\u007f\s\[\]\(\)\:\.\,\-\'\"?！，。：]')
                if not content: return False
                matches = allowed_pattern.findall(content)
                return (len(matches) / len(content)) > 0.8

            files = "${{ steps.changed-files.outputs.all_changed_files }}".split()
            deleted = "${{ steps.changed-files.outputs.deleted_files }}".split()
            
            error_msgs = []

            # 1. 拒绝删除/重命名
            if deleted:
                error_msgs.append(f"❌ 禁止删除或重命名文件: {deleted}")

            folder_counts = {}

            for file in files:
                # 2. 路径合法性
                if not file.startswith('res/'):
                    error_msgs.append(f"❌ 仅允许修改 res/ 目录下的文件: {file}")
                    continue
                if '/.' in file or os.path.islink(file):
                    error_msgs.append(f"❌ 禁止隐藏文件或符号链接: {file}")
                    continue

                filename = os.path.basename(file).lower()
                name_part, ext = os.path.splitext(filename)
                
                try:
                    file_size = os.path.getsize(file)
                except OSError:
                    continue

                # 3. 类型与内容审计
                if ext == '.lrc':
                    if file_size > 20 * 1024:
                        error_msgs.append(f"❌ LRC文件过大 (>20KB): {file}")
                    try:
                        with open(file, 'r', encoding='utf-8') as f:
                            if not is_meaningful_text(f.read()):
                                error_msgs.append(f"❌ LRC内容无效(疑似乱码或非歌词文本): {file}")
                    except UnicodeDecodeError:
                        error_msgs.append(f"❌ LRC必须使用 UTF-8 编码: {file}")
                
                elif ext in ['.jpg', '.png', '.jpeg', '.webp']:
                    if name_part != 'cover':
                        error_msgs.append(f"❌ 图片必须命名为 cover (如 cover.jpg): {file}")
                    if file_size > 5 * 1024 * 1024:
                        error_msgs.append(f"❌ 封面图片过大 (>5MB): {file}")
                
                elif ext == '.toml':
                    if filename != 'info.toml':
                        error_msgs.append(f"❌ TOML文件必须命名为 info.toml: {file}")
                    if file_size > 5 * 1024:
                        error_msgs.append(f"❌ info.toml文件过大 (>5KB): {file}")
                
                else:
                    error_msgs.append(f"❌ 不支持的文件类型 ({ext}): {file}")

                # 4. 文件夹数量限制
                dirname = os.path.dirname(file)
                folder_counts[dirname] = folder_counts.get(dirname, 0) + 1
                if folder_counts[dirname] > 20:
                    error_msgs.append(f"❌ 文件夹 {dirname} 内文件超过20个限制")

            if error_msgs:
                # 将错误信息写入临时文件以便后续步骤读取
                with open("audit_errors.txt", "w", encoding="utf-8") as f:
                    f.write("\n".join(error_msgs))
                print("\n".join(error_msgs))
                sys.exit(1)
            
            print("Audit Passed")

      - name: Notify Failure
        if: failure()
        run: |
          ERRORS=$(cat audit_errors.txt)
          gh pr comment "$PR_URL" --body "### ⚠️ 自动化审计未通过
          感谢您的贡献！但本次提交存在以下问题，请修改后重新推送：
          
          $ERRORS
          
          ---
          *修改代码后直接 Push，系统会自动重新检查。*"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Auto Approve and Merge
        if: success()
        run: |
          gh pr approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}