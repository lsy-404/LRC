name: LRC Repository Auto Audit

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'res/**'
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == 'Retry check' &&
        github.event.comment.user.login == github.repository_owner
      )
    runs-on: ubuntu-latest
    
    steps:
      - name: Resolve PR context
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
            echo "head_ref=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
            echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}" >> $GITHUB_OUTPUT
          else
            pr_number=${{ github.event.issue.number }}
            echo "number=$pr_number" >> $GITHUB_OUTPUT
            pr_json=$(gh api "repos/${{ github.repository }}/pulls/$pr_number")
            echo "head_sha=$(echo "$pr_json" | jq -r '.head.sha')" >> $GITHUB_OUTPUT
            echo "base_sha=$(echo "$pr_json" | jq -r '.base.sha')" >> $GITHUB_OUTPUT
            echo "head_ref=$(echo "$pr_json" | jq -r '.head.ref')" >> $GITHUB_OUTPUT
            echo "head_repo=$(echo "$pr_json" | jq -r '.head.repo.full_name')" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.PULL_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: false
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          token: ${{ secrets.PULL_TOKEN }}

      - name: Checkout base workflow scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .ci-base
          token: ${{ secrets.PULL_TOKEN }}

      - name: Fetch PR base commit
        run: |
          if ! git remote get-url base >/dev/null 2>&1; then
            git remote add base "https://x-access-token:${{ secrets.PULL_TOKEN }}@github.com/${{ github.repository }}.git"
          fi
          # Checkout code 是浅克隆(depth=1)，PR head 与 base_sha 各自独立浅拉取
          # 互不相连，merge-base 算不出来(git 报 "no merge base")。audit 脚本用
          # 三点 diff 需要真实连通的历史，这里先转成完整克隆再拉 base_sha。
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow base "$BASE_SHA"
          else
            git fetch --no-tags base "$BASE_SHA"
          fi
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}

      - name: Install audit dependencies
        run: pip install --quiet Pillow zxing-cpp

      - name: Security and Content Audit
        id: python-audit
        run: python3 .ci-base/.github/scripts/lrc_auto_audit.py
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        continue-on-error: true

      - name: Notify Failure
        if: steps.python-audit.outcome == 'failure'
        run: |
          ERRORS=$(cat audit_errors.txt)
          gh pr comment "$PR_NUMBER" --body "### ⚠️ 自动化审计未通过
          感谢您的贡献！但本次提交存在以下问题，请修改后重新推送：
          
          $ERRORS
          
          ---
          *修改代码后直接 Push，系统会自动重新检查。*"
        env:
          GH_TOKEN: ${{ secrets.PULL_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_REPO: ${{ github.repository }}

      - name: Auto Approve
        if: steps.python-audit.outcome == 'success'
        run: gh pr review "$PR_NUMBER" --approve
        env:
          # PULL_TOKEN 和开 PR 用的是同一身份，GitHub 不允许自己批准自己的 PR
          # （"Can not approve your own pull request"）；换成默认 GITHUB_TOKEN
          # （github-actions[bot] 身份，跟 PR 作者不是同一账号）来批准。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_REPO: ${{ github.repository }}

      - name: Auto Merge
        if: steps.python-audit.outcome == 'success'
        run: |
          # --auto 走 enablePullRequestAutoMerge GraphQL mutation，PULL_TOKEN 这个
          # PAT 对它没权限（"Resource not accessible by personal access token"），
          # 但这一步本来就已经在「audit 通过」的条件分支里、且 Cloudflare Pages
          # 预览通常并行跑得比 audit 快，多数时候此刻所有必需检查其实都已经过了，
          # 直接合并即可；仍加几次重试兜底极少数检查还没跑完的情况。
          if gh pr merge --auto --squash "$PR_NUMBER"; then
            exit 0
          fi
          echo "auto-merge unavailable, falling back to direct merge with retry"
          for i in 1 2 3 4 5; do
            if gh pr merge --squash "$PR_NUMBER"; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::direct merge retries exhausted"
          exit 1
        env:
          # 合并仍用 PULL_TOKEN：用默认 GITHUB_TOKEN 合并不会触发后续 push 到
          # main 的 workflow（generate.yml 建目录页/静态API），必须用 PAT。
          GH_TOKEN: ${{ secrets.PULL_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_REPO: ${{ github.repository }}