name: Deploy to Cloudflare Worker

on:
  # Site-source-only changes (Vue components, theme config, markdown pages).
  # The two generated output dirs are excluded: the generate job commits them and
  # then dispatches this workflow itself, so a path trigger would deploy twice.
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'functions/**'
      - 'worker/**'
      - 'runner/**'
      - '!docs/albums/**'
      - '!docs/.vuepress/public/api/**'
  # Dispatched by the ingest worker's generate job, and available for manual runs
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Build VuePress site
        run: pnpm run docs:build

      - name: Deploy Worker with static assets
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --containers-rollout=immediate
