name: Deploy to Cloudflare Pages

on:
  # Site-source-only changes (Vue components, theme config, markdown pages) don't
  # touch res/** or .github/**, so generate.yml's push trigger never fires for them
  # and nothing deploys. Deploy directly for those. Excludes the two generated
  # output dirs generate.yml itself commits back, to avoid double-deploying the
  # same content it already deploys via its downstream workflow_call below.
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '!docs/albums/**'
      - '!docs/.vuepress/public/api/**'
  # Called by generate.yml as a reusable workflow
  workflow_call:
    secrets:
      CF_API_TOKEN:
        required: true
      CF_ACCOUNT_ID:
        required: true
  # Also supports manual standalone trigger
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build VuePress site
        run: pnpm run docs:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy docs/.vuepress/dist --project-name=lrc --commit-dirty=true
