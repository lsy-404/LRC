name: Deploy to Cloudflare Worker

on:
  # Generated catalog updates dispatch deployment separately.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'docs/**'
      - 'functions/**'
      - 'worker/**'
      - 'runner/**'
      - 'studio/**'
      - '!docs/albums/**'
      - '!docs/.vuepress/public/api/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 工作站是私有方案包：只下载编译产物并校验摘要，源码不进入本仓库
      - name: Fetch private studio solution
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_KIT_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./studio/package.json').dependencies['@platform-kit/solution-studio'].match(/solution-studio-(.+)\.tgz$/)[1]")
          mkdir -p vendor
          gh release download "solution-studio-v${VERSION}" --repo lsy-404/platform-kit-internal --dir vendor --pattern "solution-studio-${VERSION}.tgz" --pattern "solution-studio-${VERSION}.tgz.sha256"
          (cd vendor && sha256sum -c "solution-studio-${VERSION}.tgz.sha256")

      - name: Install Worker dependencies
        working-directory: worker
        run: corepack pnpm@10.34.6 install --frozen-lockfile

      - name: Build VuePress site
        run: pnpm run docs:build

      - name: Build studio
        run: |
          pnpm --dir studio install --frozen-lockfile
          pnpm --dir studio run build
          test -f docs/.vuepress/dist/studio/index.html

      - name: Deploy Worker with static assets
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CF_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          packageManager: pnpm
          command: deploy --containers-rollout=immediate
