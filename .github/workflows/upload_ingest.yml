name: Upload Ingest

# 共享投递箱 upload 分支：贡献者（需仓库写权限）push 原料(歌词本图片/pdf/docx、
# 文字草稿、歌曲音频、manifest.toml)到 upload。网页工作站投稿则把文件本体直传
# R2（对象 key = web/<session>/<n>），push 里只有一个 .r2-payload.json 取料清单
# ——ingest job 开头按清单从 R2 取回原料后，两种来源的处理完全一致。分两个 job：
#   capture（不排队，每次 push 立刻跑）：把这次 push 的 SHA 锚定成一个 tag，
#     使其独立于 upload 分支引用存在——见下方 capture job 内注释，这是为了防止
#     排队中的后续 push 在轮到自己前，commit 就先被前一个 push 的 dropbox 重置
#     动作变成悬空引用。
#   ingest = Phase A（沿用原有串行排队，一次只处理一个 push）：
#     1. 从 capture 打的 tag（不是易变的 upload 分支）取走原料
#     2. 立即把 upload 重置为「仅含本工作流 + 投递说明」（force-push，腾空投递箱）
#     3. OCR / 文档抽取 / STT / LLM 编排 → 待对齐草稿（build_draft，不对齐不写 res）
#     4. 把草稿(draft/stt/cover/status) push 到 ingest-review 分支的 <sha>/ 子目录
#     5. 删掉自己那个保护用的 tag —— git 直投的原料至此销毁；R2 侧原料留到人工
#        矫正完成、Phase B 入库后由 ingest_finalize 打 .used 标记，最终由桶上的
#        生命周期规则在上传 30 天后统一删除（含从未提交的半截投稿）
#   ★ 不在此开 PR：停在「待人工闸门」。人工在工作台修改面板凭 ref=<sha> 校正 OCR/
#     meta/轨单/关联/封面后，触发 ingest_finalize.yml（Phase B）对齐入库开 PR；无人处理
#     则 ingest_timeout.yml 在 72h 后自动续跑 Phase B。
#   原料绝不进任何持久分支：git 直投的只在 runner 临时盘，upload 旧 commit 被覆盖
#   即销毁；工作站直传的存 R2（入库后标记 .used，30 天后随生命周期规则删除）。ingest-review 分支只存
#   派生态（歌词草稿/词级时间戳/meta/封面），规则允许。

on:
  push:
    branches: [upload]

permissions:
  contents: write
  pull-requests: write

jobs:
  # 单独的 job：不进 upload-ingest 并发组，每次 push 立刻跑（不排队）。
  # 只做一件事——给这次 push 的 SHA 打一个 tag，让它脱离 upload 分支引用独立存在。
  # 原因：ingest job 是排队串行的（concurrency cancel-in-progress: false）；如果
  # A、B 前后脚推送，B 的 ingest 要等 A 跑完才开始。但 A 跑完前会执行"重置 upload
  # 投递箱"（force-push 抹掉分支历史）——这一步一旦发生，B 那次 push 的 commit
  # 就不再被任何分支引用，B 排队中的 job 还没轮到执行任何自我保护的机会。
  # 单纯指望 GitHub 还没来得及垃圾回收这个悬空 commit 不是可靠保证，所以必须在
  # A 的重置有机会发生*之前*就把 B 的 commit 锚定住——这只有一个不排队、立刻跑
  # 的 job 才能做到。
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Tag payload SHA (protects it from the dropbox reset race)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 幂等：同一 SHA 被推送两次（比如重试用了完全相同的树）时 tag 已存在，
          # 创建会 422——只要确认 tag 确实存在（不管是谁先建的）就算达到目的，
          # 不是真的失败；只有"建不了也查不到"才是真失败。
          if ! gh api "repos/${{ github.repository }}/git/refs" \
               -f ref="refs/tags/upload-payload-${{ github.sha }}" \
               -f sha="${{ github.sha }}" 2>/tmp/tag_err; then
            if gh api "repos/${{ github.repository }}/git/refs/tags/upload-payload-${{ github.sha }}" >/dev/null 2>&1; then
              echo "tag 已存在（大概率是相同 SHA 的重复推送），视为成功"
            else
              cat /tmp/tag_err >&2
              exit 1
            fi
          fi

  ingest:
    needs: capture
    # 防循环：忽略 bot 自己 reset upload 触发的 push（GITHUB_TOKEN 推送本不会递归触发，双保险）
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: upload-ingest
      cancel-in-progress: false
    steps:
      - name: Resolve context
        id: ctx
        run: |
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          actor=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed 's/-\+/-/g;s/^-//;s/-$//')
          echo "actor=${actor:-contributor}" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Checkout upload payload (at protected tag, not the mutable branch)
        uses: actions/checkout@v4
        with:
          ref: refs/tags/upload-payload-${{ github.sha }}
          fetch-depth: 1
          path: payload

      # 工作站投稿：文件本体在 R2，提交里只有 .r2-payload.json 取料清单。按清单把
      # 对象取回 payload/<album>/<相对路径> 重建目录结构，清单即弃——此后管道与
      # 纯 git 投递完全一致。session/路径在 finalize 已清洗，这里再双保险一遍。
      # 取料不走 S3 API 而走站点自己的 /api/upload/payload：R2 绑定只在 Cloudflare
      # 运行时内可见，runner 不在其中，改由该端点代读后 CI 只需一个 INGEST_TOKEN，
      # 不必长期持有能直读整桶的 S3 密钥。
      - name: Fetch web payload from R2 (via upload proxy)
        id: r2
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          SITE: https://lrc.wuyilingwei.com
        run: |
          set -euo pipefail
          M=payload/.r2-payload.json
          [ -f "$M" ] || { echo "无 R2 清单（纯 git 投递），跳过"; exit 0; }
          : "${INGEST_TOKEN:?缺 INGEST_TOKEN secret}"
          session=$(jq -r '.session // empty' "$M")
          album=$(jq -r '.album // empty' "$M")
          count=$(jq '.files | length' "$M")
          [[ "$session" =~ ^[0-9a-f]{16,64}$ ]] || { echo "非法 session"; exit 1; }
          { [ -n "$album" ] && [ "$count" -gt 0 ]; } || { echo "清单缺 album/files"; exit 1; }
          case "$album" in *[/\\]*|.|..) echo "非法专辑名: $album"; exit 1;; esac
          jq -r '.files[] | [(.n|tostring), (.size|tostring), .path] | @tsv' "$M" \
          | while IFS=$'\t' read -r n size path; do
            [[ "$n" =~ ^[0-9]+$ ]] || { echo "非法条目号: $n"; exit 1; }
            case "/$path" in *"/../"*|*"/.."|"//"*) echo "非法路径: $path"; exit 1;; esac
            dest="payload/${album}/${path}"
            mkdir -p "$(dirname "$dest")"
            # --max-time 兜住卡死的连接：单文件上限 95MB，900s 足够宽裕
            curl -fsS --retry 3 --retry-delay 2 --retry-all-errors --max-time 900 \
              -H "authorization: Bearer ${INGEST_TOKEN}" \
              "${SITE}/api/upload/payload?session=${session}&n=${n}" -o "$dest"
            # 清单里的 size 是浏览器上传前的真实字节数，比对可发现截断的流
            got=$(stat -c%s "$dest")
            if [ "$size" -gt 0 ] && [ "$got" != "$size" ]; then
              echo "取料字节数不符: $path 期望 $size 实得 $got"; exit 1
            fi
          done
          rm "$M"
          echo "session=$session" >> "$GITHUB_OUTPUT"
          echo "✓ 已从 R2 取回 ${count} 个原料文件 → payload/${album}/"

      - name: Checkout main (scripts + PR base)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: repo
          # 用默认 GITHUB_TOKEN：其注入的 http.extraheader 有 contents:write，
          # 可推分支。（若用 PULL_TOKEN，它的 extraheader 会覆盖 URL token 且无推送权 → 403）

      - name: Reset upload dropbox (keep only workflow + README)
        env:
          GH_TOKEN_RESET: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          mkdir -p "$TMP/.github/workflows"
          # 投递箱只放「触发用的 workflow + 投递说明」，不含脚本（脚本在 main，运行时 checkout）。
          # 从 main(repo) 复制，使 upload 的 workflow / README 始终与 main 同步。
          cp "repo/.github/workflows/upload_ingest.yml" "$TMP/.github/workflows/upload_ingest.yml"
          cp "repo/.github/UPLOAD_README.md" "$TMP/README.md"
          cd "$TMP"
          git init -q
          git checkout -q -b upload
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -q -m "chore(upload): reset dropbox after ingest"
          # 用 GITHUB_TOKEN 推送：不会递归触发本工作流，且新单提交覆盖旧史 → 原料从 upload 历史消失
          git push -q --force \
            "https://x-access-token:${GH_TOKEN_RESET}@github.com/${{ github.repository }}.git" \
            upload
          echo "✓ upload 投递箱已重置"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            repo/.github/scripts/requirements.txt
            repo/.github/scripts/ingest/requirements.txt

# STT 已改为 OpenAI 云端 whisper-1，无本地模型可缓存

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r repo/.github/scripts/requirements.txt
          pip install -r repo/.github/scripts/ingest/requirements.txt

      - name: Run ingest Phase A (build review bundle)
        id: run
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          OCR_MODEL: ${{ secrets.OCR_MODEL }}
          PYTHONPATH: ${{ github.workspace }}/repo/.github/scripts
        run: |
          set -euo pipefail
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python -m ingest.pipeline \
            --phase a \
            --src "${{ github.workspace }}/payload" \
            --res-dir "${{ github.workspace }}/repo/res" \
            --bundle-root "${{ github.workspace }}/.bundle" \
            --timestamp "$TS" \
            --work "${{ github.workspace }}/.ingest_work" \
            --json "${{ github.workspace }}/summary.json" \
            --lyric-maker "武乙凌薇" \
            --contributor "${{ github.actor }}"
          # 是否产出 bundle
          if [ -n "$(ls -A "${{ github.workspace }}/.bundle" 2>/dev/null)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  Phase A 未产出 bundle"
          fi
          album=$(python -c "import json,sys; print(json.load(open('summary.json')).get('album',''))" 2>/dev/null || echo "")
          echo "album=${album}" >> "$GITHUB_OUTPUT"

      - name: Push review bundle to ingest-review/<sha>/
        if: steps.run.outputs.changed == 'true'
        env:
          GH_TOKEN_REVIEW: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ steps.ctx.outputs.sha }}"
          REMOTE="https://x-access-token:${GH_TOKEN_REVIEW}@github.com/${{ github.repository }}.git"
          RD=$(mktemp -d)
          # ingest-review 分支存派生态草稿，<sha>/ 一次投稿；不存在则新建 orphan。
          # 用 GITHUB_TOKEN 推：不递归触发本工作流（且 ingest-review 无 on:push 工作流）。
          if git clone --depth 1 --branch ingest-review "$REMOTE" "$RD" 2>/dev/null; then
            :
          else
            git clone --depth 1 "$REMOTE" "$RD"
            git -C "$RD" checkout --orphan ingest-review
            git -C "$RD" rm -rf . >/dev/null 2>&1 || true
            printf '# ingest-review\n\nPhase A 产出的 review bundle 暂存分支。每个 <sha>/ 子目录\n对应一次投稿（可含多张专辑子目录），Phase B 消费后删除。仅派生态，无版权原料。\n' > "$RD/README.md"
            git -C "$RD" add README.md
            git -C "$RD" -c user.name='github-actions[bot]' \
                -c user.email='github-actions[bot]@users.noreply.github.com' \
                commit -q -m "init ingest-review"
          fi
          mkdir -p "$RD/$SHA"
          cp -r "${{ github.workspace }}/.bundle/." "$RD/$SHA/"
          # 工作站投稿：把 R2 session 随 bundle 传给 Phase B——原料不销毁，
          # 人工矫正完成、Phase B 入库后由 ingest_finalize 打 .used 标记
          if [ -n "${{ steps.r2.outputs.session }}" ]; then
            echo "${{ steps.r2.outputs.session }}" > "$RD/$SHA/.r2-session"
          fi
          git -C "$RD" add "$SHA"
          git -C "$RD" -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -q -m "phase-a: ${{ steps.run.outputs.album }} ($SHA)"
          git -C "$RD" push "$REMOTE" ingest-review
          echo "✓ bundle 推入 ingest-review/$SHA/（待人工闸门 → ingest_finalize / 72h 超时）"

      - name: Clean up protective payload tag
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/upload-payload-${{ github.sha }}" || true
