name: Upload Ingest

# 共享投递箱 upload 分支：贡献者（需仓库写权限）push 原料(歌词本图片/pdf/docx、
# 文字草稿、歌曲音频、manifest.toml)到 upload。分两个 job：
#   capture（不排队，每次 push 立刻跑）：把这次 push 的 SHA 锚定成一个 tag，
#     使其独立于 upload 分支引用存在——见下方 capture job 内注释，这是为了防止
#     排队中的后续 push 在轮到自己前，commit 就先被前一个 push 的 dropbox 重置
#     动作变成悬空引用。
#   ingest（沿用原有串行排队，一次只处理一个 push）：
#     1. 从 capture 打的 tag（不是易变的 upload 分支）取走原料
#     2. 立即把 upload 重置为「仅含本工作流 + 投递说明」（force-push，腾空投递箱）
#     3. OCR / 文档抽取 / 校对 / faster-whisper STT / LLM 编排 → res/<专辑>/
#     4. 从 main 迁出分支 upload-<贡献者>-<时间>，开 PR 走现有 lrc_auto_audit 审计
#     5. 删掉自己那个保护用的 tag
#   原料全程只在 runner 临时盘，绝不进任何持久分支；upload 旧 commit 被覆盖即销毁。

on:
  push:
    branches: [upload]

permissions:
  contents: write
  pull-requests: write

jobs:
  # 单独的 job：不进 upload-ingest 并发组，每次 push 立刻跑（不排队）。
  # 只做一件事——给这次 push 的 SHA 打一个 tag，让它脱离 upload 分支引用独立存在。
  # 原因：ingest job 是排队串行的（concurrency cancel-in-progress: false）；如果
  # A、B 前后脚推送，B 的 ingest 要等 A 跑完才开始。但 A 跑完前会执行"重置 upload
  # 投递箱"（force-push 抹掉分支历史）——这一步一旦发生，B 那次 push 的 commit
  # 就不再被任何分支引用，B 排队中的 job 还没轮到执行任何自我保护的机会。
  # 单纯指望 GitHub 还没来得及垃圾回收这个悬空 commit 不是可靠保证，所以必须在
  # A 的重置有机会发生*之前*就把 B 的 commit 锚定住——这只有一个不排队、立刻跑
  # 的 job 才能做到。
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Tag payload SHA (protects it from the dropbox reset race)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 幂等：同一 SHA 被推送两次（比如重试用了完全相同的树）时 tag 已存在，
          # 创建会 422——只要确认 tag 确实存在（不管是谁先建的）就算达到目的，
          # 不是真的失败；只有"建不了也查不到"才是真失败。
          if ! gh api "repos/${{ github.repository }}/git/refs" \
               -f ref="refs/tags/upload-payload-${{ github.sha }}" \
               -f sha="${{ github.sha }}" 2>/tmp/tag_err; then
            if gh api "repos/${{ github.repository }}/git/refs/tags/upload-payload-${{ github.sha }}" >/dev/null 2>&1; then
              echo "tag 已存在（大概率是相同 SHA 的重复推送），视为成功"
            else
              cat /tmp/tag_err >&2
              exit 1
            fi
          fi

  ingest:
    needs: capture
    # 防循环：忽略 bot 自己 reset upload 触发的 push（GITHUB_TOKEN 推送本不会递归触发，双保险）
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: upload-ingest
      cancel-in-progress: false
    steps:
      - name: Resolve context
        id: ctx
        run: |
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          actor=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed 's/-\+/-/g;s/^-//;s/-$//')
          echo "actor=${actor:-contributor}" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Checkout upload payload (at protected tag, not the mutable branch)
        uses: actions/checkout@v4
        with:
          ref: refs/tags/upload-payload-${{ github.sha }}
          fetch-depth: 1
          path: payload

      - name: Checkout main (scripts + PR base)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: repo
          # 用默认 GITHUB_TOKEN：其注入的 http.extraheader 有 contents:write，
          # 可推分支。（若用 PULL_TOKEN，它的 extraheader 会覆盖 URL token 且无推送权 → 403）

      - name: Reset upload dropbox (keep only workflow + README)
        env:
          GH_TOKEN_RESET: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          mkdir -p "$TMP/.github/workflows"
          # 投递箱只放「触发用的 workflow + 投递说明」，不含脚本（脚本在 main，运行时 checkout）。
          # 从 main(repo) 复制，使 upload 的 workflow / README 始终与 main 同步。
          cp "repo/.github/workflows/upload_ingest.yml" "$TMP/.github/workflows/upload_ingest.yml"
          cp "repo/.github/UPLOAD_README.md" "$TMP/README.md"
          cd "$TMP"
          git init -q
          git checkout -q -b upload
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -q -m "chore(upload): reset dropbox after ingest"
          # 用 GITHUB_TOKEN 推送：不会递归触发本工作流，且新单提交覆盖旧史 → 原料从 upload 历史消失
          git push -q --force \
            "https://x-access-token:${GH_TOKEN_RESET}@github.com/${{ github.repository }}.git" \
            upload
          echo "✓ upload 投递箱已重置"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            repo/.github/scripts/requirements.txt
            repo/.github/scripts/ingest/requirements.txt

      - name: Cache HuggingFace models (whisper/pyannote/wav2vec2)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ vars.WHISPER_MODEL || 'small' }}-v1

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r repo/.github/scripts/requirements.txt
          pip install -r repo/.github/scripts/ingest/requirements.txt

      - name: Run ingest pipeline
        id: run
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          OCR_MODEL: ${{ secrets.OCR_MODEL }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
          WHISPER_VAD: ${{ vars.WHISPER_VAD || 'pyannote' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/repo/.github/scripts
        run: |
          set -euo pipefail
          python -m ingest.pipeline \
            --src "${{ github.workspace }}/payload" \
            --res-dir "${{ github.workspace }}/repo/res" \
            --work "${{ github.workspace }}/.ingest_work" \
            --json "${{ github.workspace }}/summary.json" \
            --lyric-maker "武乙凌薇"
          # 是否有产物
          if git -C repo status --porcelain res | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  未产生 res 改动，跳过开 PR"
          fi
          album=$(python -c "import json,sys; print(json.load(open('summary.json')).get('album',''))" 2>/dev/null || echo "")
          echo "album=${album}" >> "$GITHUB_OUTPUT"
          is_update=$(python -c "import json,sys; print('true' if json.load(open('summary.json')).get('is_update') else 'false')" 2>/dev/null || echo "false")
          echo "is_update=${is_update}" >> "$GITHUB_OUTPUT"

      - name: Fetch Bilibili metadata for ingested album
        if: steps.run.outputs.changed == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/repo/.github/scripts
        run: |
          ALBUM="${{ steps.run.outputs.album }}"
          if [ -n "$ALBUM" ]; then
            cd "${{ github.workspace }}/repo"
            python .github/scripts/fetch_bilibili_meta.py \
              --album "$ALBUM" --auto --fields release,year,electronic
          fi
        continue-on-error: true

      - name: Open PR from upload-<contributor>-<ts>
        if: steps.run.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PULL_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BRANCH="upload-${{ steps.ctx.outputs.actor }}-${{ steps.ctx.outputs.ts }}"
          IS_UPDATE="${{ steps.run.outputs.is_update }}"
          if [ "$IS_UPDATE" = "true" ]; then
            PR_VERB="update"
            PR_ICON="🔄"
            PR_DESC="增补已有专辑数据（LRC / 封面 / meta）"
          else
            PR_VERB="ingest"
            PR_ICON="🤖"
            PR_DESC="新专辑摄取投稿"
          fi
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add res
          git commit -m "${PR_VERB}: ${{ steps.run.outputs.album }} (via upload by @${{ github.actor }})"
          # 推 origin：repo 由默认 GITHUB_TOKEN checkout，其 extraheader 有 contents:write。
          # PR 由下方 gh(GH_TOKEN=PULL_TOKEN=PAT) 创建 → 才能触发 lrc_auto_audit。
          git push origin "$BRANCH"
          BODY=$(cat <<EOF
          ### ${PR_ICON} 自动摄取 — ${PR_DESC}

          - 投稿者：@${{ github.actor }}
          - 专辑：\`${{ steps.run.outputs.album }}\`
          - 模式：$([ "$IS_UPDATE" = "true" ] && echo "**增补**（已有专辑，仅覆盖本次上传的文件）" || echo "**新建**")
          - 来源：upload 投递箱（原料已销毁，仅派生产物入库）

          <details><summary>处理摘要</summary>

          \`\`\`json
          $(cat ../summary.json)
          \`\`\`
          </details>

          > ⚠️ STT 歌词为机器转写，meta 为 LLM 抽取，**请人工复核**后再依赖自动合并。
          EOF
          )
          # 正式 PR：交由现有 lrc_auto_audit 审计，通过即自动 approve + squash 合并进 main。
          gh pr create --base main --head "$BRANCH" \
            --title "${PR_VERB}: ${{ steps.run.outputs.album }} (@${{ github.actor }})" \
            --body "$BODY"

      - name: Clean up protective payload tag
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/upload-payload-${{ github.sha }}" || true
