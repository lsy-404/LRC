name: Generate Catalog and Album Packs

on:
  push:
    branches:
      - main
    paths:
      - 'res/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skipped: ${{ steps.check_commit.outputs.skip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Need full history to check ZIP last modification commit

      - name: Prepare - Check if last commit was by Action
        id: check_commit
        run: |
          last_author=$(git log -1 --pretty=format:'%an')
          echo "Last commit author: $last_author"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # 手动触发是人主动要求的全量重建，不适用防递归守卫
            echo "Manual dispatch - bypassing bot-commit guard."
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [[ "$last_author" == "github-actions[bot]" ]]; then
            echo "Last commit was by github-actions[bot]. Skipping execution."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Proceeding with optimization."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check_commit.outputs.skip == 'false'
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        if: steps.check_commit.outputs.skip == 'false'
        run: |
          pip install -r .github/scripts/requirements.txt

      - name: Generate meta.toml from LRC metadata
        if: steps.check_commit.outputs.skip == 'false'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python .github/scripts/generate_meta.py

      - name: Detect albums needing rebuild
        if: steps.check_commit.outputs.skip == 'false'
        id: detect_changes
        run: |
          # Check if this is a manual trigger (workflow_dispatch)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger detected - rebuilding all albums"
            ALBUMS_TO_BUILD=$(find res -maxdepth 1 -mindepth 1 -type d | sed 's|^res/||' | sort)
            REBUILD_ALL="true"
          else
            echo "Smart incremental build - checking each album's ZIP history"
            REBUILD_ALL="false"
            ALBUMS_TO_BUILD=""
            
            # Check each album directory
            for album_dir in res/*/; do
              [ -d "$album_dir" ] || continue
              album_name=$(basename "$album_dir")
              zip_file="pack/${album_name}.zip"
              
              # Find when the ZIP was last modified in git history
              last_zip_commit=$(git log -1 --format=%H -- "$zip_file" 2>/dev/null || echo "")
              
              if [ -z "$last_zip_commit" ]; then
                # ZIP doesn't exist or was never committed - need to build
                echo "✓ $album_name: No ZIP found in history, will build"
                ALBUMS_TO_BUILD="${ALBUMS_TO_BUILD}${album_name}"$'\n'
              else
                # Check if res directory has changes since last ZIP commit
                changes=$(git diff --name-only "$last_zip_commit" HEAD -- "$album_dir" 2>/dev/null || echo "")
                
                if [ -n "$changes" ]; then
                  echo "✓ $album_name: Has changes since last build"
                  echo " Changed files:"
                  echo "$changes" | sed 's/^/    /'
                  ALBUMS_TO_BUILD="${ALBUMS_TO_BUILD}${album_name}"$'\n'
                else
                  echo "○ $album_name: Up-to-date (no changes since $(git log -1 --format=%h -- "$zip_file"))"
                fi
              fi
            done
          fi
          
          echo ""
          echo "Albums to build:"
          echo "$ALBUMS_TO_BUILD"
          
          # Save to file for next step
          echo "$ALBUMS_TO_BUILD" > changed_albums.txt
          echo "$REBUILD_ALL" > rebuild_all.txt

      - name: Create or update album zip files
        if: steps.check_commit.outputs.skip == 'false'
        run: |
          # Ensure pack directory exists
          mkdir -p pack
          
          # Read rebuild flag
          REBUILD_ALL=$(cat rebuild_all.txt 2>/dev/null || echo "false")
          
          # Read changed albums
          if [ -f changed_albums.txt ] && [ -s changed_albums.txt ]; then
            echo "Creating/updating zip files for changed albums..."
            while IFS= read -r album; do
              if [ -d "res/$album" ] && [ ! -z "$album" ]; then
                echo "Processing album: $album"
                # Remove old zip if exists
                album_name=$(basename "$album")
                zip_file="pack/${album_name}.zip"
                if [ -f "$zip_file" ]; then
                  rm "$zip_file"
                  echo "Removed old $zip_file"
                fi
                
                # Create new zip with all required files
                files_to_zip=()
                
                # Add .lrc files
                if ls "res/$album"/*.lrc 1> /dev/null 2>&1; then
                  files_to_zip+=(*.lrc)
                fi
                
                # Add .klrc per-char lyric files
                if ls "res/$album"/*.klrc 1> /dev/null 2>&1; then
                  files_to_zip+=(*.klrc)
                fi
                
                # Add .txt files
                if ls "res/$album"/*.txt 1> /dev/null 2>&1; then
                  files_to_zip+=(*.txt)
                fi
                
                # Add meta.toml if exists
                if [ -f "res/$album/meta.toml" ]; then
                  files_to_zip+=(meta.toml)
                fi
                
                # Add cover files if they exist
                if ls "res/$album"/cover.* 1> /dev/null 2>&1; then
                  files_to_zip+=(cover.*)
                fi
                
                if [ ${#files_to_zip[@]} -gt 0 ]; then
                  cd "res/$album"
                  zip -q "../../$zip_file" -- ${files_to_zip[@]}
                  cd ../..
                  echo "Created $zip_file (with $(echo ${files_to_zip[@]} | wc -w) files)"
                else
                  echo "No files found in res/$album"
                fi
              fi
            done < changed_albums.txt
          else
            echo "No album changes detected"
          fi
          
          # Also check for albums without zip files and create them
          # Or rebuild all if manual trigger
          if [ "$REBUILD_ALL" == "true" ]; then
            echo "Rebuilding all albums (manual trigger)..."
            for album in res/*/; do
              album_name=$(basename "$album")
              zip_file="pack/${album_name}.zip"
              # Remove existing zip file during manual rebuild
              if [ -f "$zip_file" ]; then
                rm "$zip_file"
                echo "Removed old $zip_file"
              fi
              
              # Create new zip with all files
              files_to_zip=()
              
              # Add .lrc files
              if ls "$album"/*.lrc 1> /dev/null 2>&1; then
                files_to_zip+=(*.lrc)
              fi
              
              # Add .klrc per-char lyric files
              if ls "$album"/*.klrc 1> /dev/null 2>&1; then
                files_to_zip+=(*.klrc)
              fi
              
              # Add .txt files
              if ls "$album"/*.txt 1> /dev/null 2>&1; then
                files_to_zip+=(*.txt)
              fi
              
              # Add meta.toml if exists
              if [ -f "$album/meta.toml" ]; then
                files_to_zip+=(meta.toml)
              fi
              
              # Add cover files if they exist
              if ls "$album"/cover.* 1> /dev/null 2>&1; then
                files_to_zip+=(cover.*)
              fi
              
              if [ ${#files_to_zip[@]} -gt 0 ]; then
                cd "$album"
                zip -q "../../$zip_file" -- ${files_to_zip[@]}
                cd ../..
                echo "Created $zip_file (with $(echo ${files_to_zip[@]} | wc -w) files)"
              fi
            done
          else
            echo "Checking for albums without zip files..."
            for album in res/*/; do
              album_name=$(basename "$album")
              zip_file="pack/${album_name}.zip"
              if [ ! -f "$zip_file" ] && [ -d "$album" ]; then
                echo "Creating missing zip for: $album_name"
                
                # Create new zip with all files
                files_to_zip=()
                
                # Add .lrc files
                if ls "$album"/*.lrc 1> /dev/null 2>&1; then
                  files_to_zip+=(*.lrc)
                fi
                
                # Add .klrc per-char lyric files
                if ls "$album"/*.klrc 1> /dev/null 2>&1; then
                  files_to_zip+=(*.klrc)
                fi
                
                # Add .txt files
                if ls "$album"/*.txt 1> /dev/null 2>&1; then
                  files_to_zip+=(*.txt)
                fi
                
                # Add meta.toml if exists
                if [ -f "$album/meta.toml" ]; then
                  files_to_zip+=(meta.toml)
                fi
                
                # Add cover files if they exist
                if ls "$album"/cover.* 1> /dev/null 2>&1; then
                  files_to_zip+=(cover.*)
                fi
                
                if [ ${#files_to_zip[@]} -gt 0 ]; then
                  cd "$album"
                  zip -q "../../$zip_file" -- ${files_to_zip[@]}
                  cd ../..
                  echo "Created $zip_file (with $(echo ${files_to_zip[@]} | wc -w) files)"
                fi
              fi
            done
          fi

          # Clean up orphan zip files in pack/ that no longer have corresponding album directories
          echo "Cleaning orphan zip files in pack/..."
          if compgen -G "pack/*.zip" > /dev/null; then
            for zip in pack/*.zip; do
              album_name=$(basename "$zip" .zip)
              if [ ! -d "res/$album_name" ]; then
                rm "$zip"
                echo "Removed obsolete $zip (no matching res/$album_name)"
              fi
            done
          else
            echo "No zip files found in pack/ to clean."
          fi

      - name: Run Tag and SEO Optimization
        if: steps.check_commit.outputs.skip == 'false'
        run: |
          python .github/scripts/optimize.py

      - name: Clean albums directory
        if: steps.check_commit.outputs.skip == 'false'
        run: |
          echo "Cleaning docs/albums directory..."
          rm -rf docs/albums
          mkdir -p docs/albums
          echo "docs/albums cleaned and recreated"

      - name: Generate MD files
        if: steps.check_commit.outputs.skip == 'false'
        run: python .github/scripts/generate_md.py

      - name: Generate static API JSON
        if: steps.check_commit.outputs.skip == 'false'
        run: python .github/scripts/generate_api.py

      - name: Generate metadata integrity report
        if: steps.check_commit.outputs.skip == 'false'
        run: python .github/scripts/generate_report.py

      - name: Commit and push changes
        if: steps.check_commit.outputs.skip == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Add all generated files
          git add README.md pack/ docs/ res/
          # Check if there are changes staged
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: optimize tags, update catalog and generate pages"
            if ! git push; then
              echo "Push failed - remote may have newer commits. Exiting gracefully."
              exit 0
            fi
          fi

  deploy:
    needs: optimize
    if: needs.optimize.outputs.skipped == 'false'
    uses: ./.github/workflows/deploy.yml
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
